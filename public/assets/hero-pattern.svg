<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1440 640" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.12" />
    </pattern>
  </defs>
  <rect width="1440" height="640" fill="url(#dots)" />

  <!-- rising bars, echoing the logo -->
  <g fill-opacity="0.28">
    <rect x="980" y="400" width="96" height="240" fill="#1B508F" />
    <rect x="1100" y="320" width="96" height="320" fill="#00875F" />
    <rect x="1220" y="220" width="96" height="420" fill="#ffffff" />
  </g>
  <polygon points="1268,150 1320,150 1294,196" fill="#F28C28" fill-opacity="0.85" transform="rotate(180 1293 173)" />
</svg>